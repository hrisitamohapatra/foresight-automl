[pytest]
testpaths = tests
filterwarnings =
    # Third-party notice from inside the shap library (not our code).
    ignore::PendingDeprecationWarning:shap.*
    # scikit-learn notice that its global settings may not reach parallel worker
    # threads. It appears intermittently when Streamlit tests run in the same
    # process. Harmless here: this project never changes scikit-learn settings.
    ignore:`sklearn.utils.parallel.delayed` should be used with:UserWarning
